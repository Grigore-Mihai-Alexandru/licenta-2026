<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pic2Solid — 3D Viewer</title>
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        body { background: #06060F; overflow: hidden; font-family: 'Consolas', monospace; }
        canvas { display: block; width: 100vw; height: 100vh; }

        /* -- Sidebar -- */
        #sidebar {
            position: absolute;
            top: 12px; left: 12px;
            display: flex; flex-direction: column; gap: 6px;
            max-width: 200px;
            z-index: 10;
        }
        .model-btn {
            background: #121220;
            border: 1px solid #2E2E52;
            color: #7878A8;
            padding: 6px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-family: 'Consolas', monospace;
            font-size: 11px;
            letter-spacing: 1px;
            text-align: left;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            transition: border-color 0.15s, color 0.15s, background 0.15s;
        }
        .model-btn:hover  { border-color: #B07818; color: #E8A020; background: #E8A02015; }
        .model-btn.active { border-color: #E8A020; color: #E8A020; background: #E8A02015; }

        /* -- Top-right controls -- */
        #overlay {
            position: absolute;
            top: 12px; right: 12px;
            display: flex; flex-direction: column; gap: 6px;
            z-index: 10;
        }
        .overlay-btn {
            background: #121220CC;
            border: 1px solid #2E2E52;
            color: #7878A8;
            padding: 5px 10px;
            border-radius: 6px;
            cursor: pointer;
            font-family: 'Consolas', monospace;
            font-size: 10px;
            letter-spacing: 1px;
            transition: border-color 0.15s, color 0.15s;
        }
        .overlay-btn:hover { border-color: #E8A020; color: #E8A020; }

        /* -- Empty state -- */
        #empty {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            color: #3C3C60;
            pointer-events: none;
        }
        #empty .hex  { font-size: 36px; margin-bottom: 10px; }
        #empty .main { font-size: 14px; }
        #empty .sub  { font-size: 11px; color: #1E1E38; margin-top: 6px; }

        /* -- Loading -- */
        #loader {
            display: none;
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            color: #E8A020;
            font-size: 11px;
            letter-spacing: 2px;
        }

        /* -- Triangle counter -- */
        #tri-count {
            display: none;
            position: absolute;
            bottom: 12px; right: 12px;
            background: #121220CC;
            border: 1px solid #2E2E52;
            border-radius: 6px;
            padding: 6px 12px;
            text-align: right;
            z-index: 10;
            pointer-events: none;
        }
        #tri-count .tri-num {
            color: #E8A020;
            font-family: 'Consolas', monospace;
            font-size: 13px;
            letter-spacing: 1px;
        }
        #tri-count .tri-label {
            color: #7878A8;
            font-family: 'Consolas', monospace;
            font-size: 9px;
            letter-spacing: 2px;
            margin-top: 2px;
        }

        /* -- View-mode buttons (bottom-left, Blender-style) -- */
        #view-modes {
            position: absolute;
            bottom: 12px; left: 12px;
            display: flex;
            gap: 4px;
            z-index: 10;
        }
        .vm-btn {
            width: 32px; height: 32px;
            background: #121220CC;
            border: 1px solid #2E2E52;
            border-radius: 6px;
            color: #7878A8;
            font-size: 16px;
            line-height: 1;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0;
            transition: border-color 0.15s, color 0.15s, background 0.15s;
        }
        .vm-btn:hover  { border-color: #B07818; color: #E8A020; background: #E8A02015; }
        .vm-btn.active { border-color: #E8A020; color: #E8A020; background: #E8A02015; }
    </style>

    <script type="importmap">
    {
        "imports": {
            "three":                                      "./assets/js/three.module.js",
            "three/addons/loaders/GLTFLoader.js":         "./assets/js/GLTFLoader.js",
            "three/addons/loaders/OBJLoader.js":          "./assets/js/OBJLoader.js",
            "three/addons/loaders/STLLoader.js":          "./assets/js/STLLoader.js",
            "three/addons/loaders/MTLLoader.js":          "./assets/js/MTLLoader.js",
            "three/addons/controls/OrbitControls.js":     "./assets/js/OrbitControls.js",
            "three/addons/utils/BufferGeometryUtils.js":  "./assets/js/BufferGeometryUtils.js"
        }
    }
    </script>
</head>
<body>
    <div id="sidebar"></div>
    <div id="overlay"></div>
    <div id="empty">
        <div class="hex">&#x2B21;</div>
        <div class="main">3D Viewer</div>
        <div class="sub">No model loaded</div>
    </div>
    <!-- View-mode buttons: Wireframe / Solid / Material Preview / Rendered -->
    <div id="view-modes">
        <button type="button" class="vm-btn" id="vm-wireframe" title="Wireframe">○</button>
        <button type="button" class="vm-btn active" id="vm-solid" title="Solid">●</button>
        <button type="button" class="vm-btn" id="vm-material" title="Material Preview">◑</button>
        <button type="button" class="vm-btn" id="vm-rendered" title="Rendered">◎</button>
    </div>
    <div id="loader">LOADING...</div>
    <div id="tri-count">
        <div class="tri-num" id="tri-num">0</div>
        <div class="tri-label">TRIANGLES</div>
    </div>

    <script type="module">
        import * as THREE        from 'three';
        import { GLTFLoader }    from 'three/addons/loaders/GLTFLoader.js';
        import { OBJLoader }     from 'three/addons/loaders/OBJLoader.js';
        import { STLLoader }     from 'three/addons/loaders/STLLoader.js';
        import { MTLLoader }     from 'three/addons/loaders/MTLLoader.js';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

        // -- Renderer / Scene / Camera -------------------------------------

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setPixelRatio(window.devicePixelRatio);
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setClearColor(0x06060F);
        renderer.shadowMap.enabled = true;
        document.body.appendChild(renderer.domElement);

        const scene  = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(
            45, window.innerWidth / window.innerHeight, 0.001, 5000
        );
        camera.position.set(2, 1.5, 3);

        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.06;

        // Lighting — stored so view-mode switching can adjust intensity
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.7);
        scene.add(ambientLight);
        const keyLight = new THREE.DirectionalLight(0xffffff, 1.1);
        keyLight.position.set(5, 10, 5);
        scene.add(keyLight);
        const fillLight = new THREE.DirectionalLight(0xE8A020, 0.3);
        fillLight.position.set(-5, 3, -5);
        scene.add(fillLight);

        // Grid
        const grid = new THREE.GridHelper(20, 40, 0x1E1E38, 0x1E1E38);
        grid.material.opacity = 0.4;
        grid.material.transparent = true;
        scene.add(grid);

        // -- View modes ----------------------------------------------------

        let viewMode = 'solid';

        const SOLID_MAT = () => new THREE.MeshStandardMaterial(
            { color: 0xCCCCCC, roughness: 0.7, metalness: 0.1 }
        );

        function applyViewMode() {
            Object.values(models).forEach(m => {
                m.object3D.traverse(child => {
                    if (!child.isMesh) return;
                    switch (viewMode) {
                        case 'wireframe':
                            if (!child.userData.wireMat) {
                                child.userData.wireMat = new THREE.MeshBasicMaterial(
                                    { color: 0xE8A020, wireframe: true }
                                );
                            }
                            child.material = child.userData.wireMat;
                            break;
                        case 'solid':
                            child.material = child.userData.solidMat || SOLID_MAT();
                            break;
                        case 'material':
                        case 'rendered': {
                            const orig = child.userData.originalMat;
                            child.material = orig || child.userData.solidMat;
                            break;
                        }
                    }
                });
            });

            // Lighting & tone-mapping per mode
            switch (viewMode) {
                case 'wireframe':
                    renderer.toneMapping         = THREE.NoToneMapping;
                    ambientLight.intensity       = 0.0;
                    keyLight.intensity           = 0.0;
                    fillLight.intensity          = 0.0;
                    break;
                case 'solid':
                    renderer.toneMapping         = THREE.NoToneMapping;
                    ambientLight.intensity       = 0.7;
                    keyLight.intensity           = 1.1;
                    fillLight.intensity          = 0.3;
                    break;
                case 'material':
                    renderer.toneMapping         = THREE.NoToneMapping;
                    ambientLight.intensity       = 1.0;
                    keyLight.intensity           = 1.3;
                    fillLight.intensity          = 0.4;
                    break;
                case 'rendered':
                    renderer.toneMapping         = THREE.ACESFilmicToneMapping;
                    renderer.toneMappingExposure = 1.2;
                    ambientLight.intensity       = 0.15;
                    keyLight.intensity           = 2.2;
                    fillLight.intensity          = 0.9;
                    break;
            }
        }

        function setViewMode(mode) {
            viewMode = mode;
            document.querySelectorAll('.vm-btn').forEach(b => b.classList.remove('active'));
            document.getElementById('vm-' + mode).classList.add('active');
            applyViewMode();
        }

        // -- Triangle counting ---------------------------------------------

        function countTriangles(object3D) {
            let n = 0;
            object3D.traverse(child => {
                if (!child.isMesh || !child.geometry) return;
                const geo = child.geometry;
                n += geo.index
                    ? geo.index.count / 3
                    : geo.attributes.position.count / 3;
            });
            return Math.round(n);
        }

        function updateTriCount() {
            const el  = document.getElementById('tri-count');
            const num = document.getElementById('tri-num');
            const visible = Object.values(models).filter(m => m.visible);
            if (visible.length === 0) { el.style.display = 'none'; return; }
            const total = visible.reduce((s, m) => s + countTriangles(m.object3D), 0);
            num.textContent   = total.toLocaleString();
            el.style.display  = 'block';
        }

        // -- Model registry ------------------------------------------------
        // { key: { label, object3D, visible } }
        const models = {};

        function fitCamera(object) {
            const box    = new THREE.Box3().setFromObject(object);
            const center = box.getCenter(new THREE.Vector3());
            const size   = box.getSize(new THREE.Vector3());
            const maxDim = Math.max(size.x, size.y, size.z) || 1;
            const fov    = camera.fov * (Math.PI / 180);
            const dist   = (maxDim / (2 * Math.tan(fov / 2))) * 1.8;

            controls.target.copy(center);
            camera.position.set(
                center.x + dist * 0.7,
                center.y + dist * 0.5,
                center.z + dist
            );
            camera.near = maxDim * 0.001;
            camera.far  = maxDim * 500;
            camera.updateProjectionMatrix();
            controls.update();
            grid.position.y = box.min.y;
        }

        function setVisible(key, visible) {
            const m = models[key];
            if (!m) return;
            m.visible           = visible;
            m.object3D.visible  = visible;
            if (visible) fitCamera(m.object3D);
            refreshUI();
        }

        function refreshUI() {
            const sidebar = document.getElementById('sidebar');
            const overlay = document.getElementById('overlay');
            sidebar.innerHTML = '';
            overlay.innerHTML = '';
            updateTriCount();

            const keys = Object.keys(models);
            document.getElementById('empty').style.display =
                keys.length === 0 ? 'block' : 'none';

            keys.forEach(key => {
                const m   = models[key];
                const btn = document.createElement('button');
                btn.className   = 'model-btn' + (m.visible ? ' active' : '');
                btn.textContent = m.label;
                btn.title       = key;
                btn.onclick     = () => setVisible(key, !m.visible);
                sidebar.appendChild(btn);
            });

            if (keys.length > 1) {
                const showAll = document.createElement('button');
                showAll.className   = 'overlay-btn';
                showAll.textContent = 'SHOW ALL';
                showAll.onclick     = () => keys.forEach(k => setVisible(k, true));
                overlay.appendChild(showAll);

                const hideAll = document.createElement('button');
                hideAll.className   = 'overlay-btn';
                hideAll.textContent = 'HIDE ALL';
                hideAll.onclick     = () => keys.forEach(k => setVisible(k, false));
                overlay.appendChild(hideAll);
            }
        }

        function registerModel(key, label, object3D) {
            object3D.traverse(child => {
                if (!child.isMesh) return;
                // Ensure a material exists before we stash it
                if (!child.material) child.material = SOLID_MAT();
                // Store original (textured) material for Material/Rendered modes
                child.userData.originalMat = child.material;
                // Dedicated solid-grey material for Solid mode
                child.userData.solidMat    = SOLID_MAT();
                child.castShadow    = true;
                child.receiveShadow = true;
            });

            // Hide other models when a new one arrives
            Object.values(models).forEach(m => {
                m.visible          = false;
                m.object3D.visible = false;
            });

            models[key] = { label, object3D, visible: true };
            scene.add(object3D);

            fitCamera(object3D);
            document.getElementById('loader').style.display = 'none';
            applyViewMode();
            refreshUI();
        }

        // -- Loaders -------------------------------------------------------

        function loadGLB(key, url, label) {
            document.getElementById('loader').style.display = 'block';
            new GLTFLoader().load(
                url,
                gltf => registerModel(key, label, gltf.scene),
                undefined,
                err  => {
                    console.error('GLB load error:', err);
                    document.getElementById('loader').style.display = 'none';
                }
            );
        }

        function loadOBJ(key, url, label) {
            document.getElementById('loader').style.display = 'block';
            const basePath = url.slice(0, url.lastIndexOf('/') + 1);
            // PyMeshLab appends .mtl to the full filename: model_lowpoly.obj → model_lowpoly.obj.mtl
            // Fall back to the stripped form (model_lowpoly.mtl) for other exporters
            const mtlUrl   = url + '.mtl';

            function doLoadOBJ(materials) {
                const loader = new OBJLoader();
                if (materials) { materials.preload(); loader.setMaterials(materials); }
                loader.load(
                    url,
                    obj => registerModel(key, label, obj),
                    undefined,
                    err => {
                        console.error('OBJ load error:', err);
                        document.getElementById('loader').style.display = 'none';
                    }
                );
            }

            // Try to load companion .mtl; fall back gracefully if absent
            new MTLLoader()
                .setPath(basePath)
                .load(mtlUrl, doLoadOBJ, undefined, () => doLoadOBJ(null));
        }

        function loadSTL(key, url, label) {
            document.getElementById('loader').style.display = 'block';
            new STLLoader().load(
                url,
                geo => {
                    geo.computeVertexNormals();
                    const mat  = new THREE.MeshStandardMaterial(
                        { color: 0xCCCCCC, roughness: 0.55, metalness: 0.05,
                          vertexColors: geo.hasColors || false }
                    );
                    const mesh = new THREE.Mesh( geo, mat );
                    mesh.castShadow    = true;
                    mesh.receiveShadow = true;
                    const group = new THREE.Group();
                    group.add( mesh );
                    registerModel( key, label, group );
                },
                undefined,
                err => {
                    console.error('STL load error:', err);
                    document.getElementById('loader').style.display = 'none';
                }
            );
        }

        // -- Public API ----------------------------------------------------

        window.addModel = function(url, label) {
            if (!url) return;
            label     = label || url.split(/[\\/]/).pop();
            const ext = url.split('.').pop().toLowerCase();
            if      (ext === 'glb' || ext === 'gltf') loadGLB(url, url, label);
            else if (ext === 'obj')                    loadOBJ(url, url, label);
            else if (ext === 'stl')                    loadSTL(url, url, label);
        };

        window.loadModel = function(url, label) {
            window.clearModels();
            window.addModel(url, label);
        };

        window.clearModels = function() {
            Object.values(models).forEach(m => scene.remove(m.object3D));
            for (const k in models) delete models[k];
            refreshUI();
        };

        // -- Render loop ---------------------------------------------------

        (function animate() {
            requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, camera);
        })();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        refreshUI();

        // View-mode button wiring
        document.getElementById('vm-wireframe').onclick = () => setViewMode('wireframe');
        document.getElementById('vm-solid'    ).onclick = () => setViewMode('solid');
        document.getElementById('vm-material' ).onclick = () => setViewMode('material');
        document.getElementById('vm-rendered' ).onclick = () => setViewMode('rendered');
    </script>
</body>
</html>
