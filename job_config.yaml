workerPoolSpecs:
  machineSpec:
    machineType: g2-standard-4
    acceleratorType: NVIDIA_L4
    acceleratorCount: 1
  replicaCount: 1
  diskSpec:
    bootDiskType: pd-ssd
    bootDiskSizeGb: 200
  containerSpec:
    imageUri: europe-west4-docker.pkg.dev/restormer-ai/ai-models/ai-pipeline:v1
    args:
      - --input_image
      - gs://ai-reconstruction-restormer-ai/inputs/cute_tiger.jpg
      - --output_dir
      - gs://ai-reconstruction-restormer-ai/outputs
      - --wonder3d_mode
      - official
      - --restormer_tasks
      - Real_Denoising
      - --crop
      - "192"
      - --refine
      - "2"
      - --mesh_faces
      - "8000"
      - --mesh_stages
      - "4"
      - --mesh_intermediate
      - --mesh_print
      - --mesh_size
      - "200"